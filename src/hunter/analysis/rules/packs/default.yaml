pack_id: hunter-default
version: "3"
rules:
  - id: RULE-SQLI-001
    description: "Graph flow from HTTP source to SQL sink without prepare mitigation on path"
    severity_band: MEDIUM
    python_evaluator_id: sqli_graph
    min_graph_schema_version: "3"
    evaluator_params:
      emit_one_per_sink: true
  - id: RULE-XSS-001
    description: "Graph flow from HTTP source to HTML echo sink"
    severity_band: LOW
    python_evaluator_id: xss_graph
    min_graph_schema_version: "3"
    evaluator_params:
      emit_one_per_sink: true
  - id: RULE-REDIRECT-001
    description: "Graph flow to open redirect sink"
    severity_band: MEDIUM
    python_evaluator_id: redirect_graph
    min_graph_schema_version: "3"
    evaluator_params:
      emit_one_per_sink: true
  - id: RULE-LFI-001
    description: "Graph flow to local file include sink"
    severity_band: MEDIUM
    python_evaluator_id: lfi_graph
    min_graph_schema_version: "3"
    evaluator_params:
      require_non_static_sink: true
      emit_one_per_sink: true
  - id: RULE-RFI-001
    description: "Graph flow to remote file read sink"
    severity_band: HIGH
    python_evaluator_id: rfi_graph
    min_graph_schema_version: "3"
    evaluator_params:
      require_non_static_sink: true
      emit_one_per_sink: true
  - id: RULE-RCE-001
    description: "Graph flow to code execution sink"
    severity_band: CRITICAL
    python_evaluator_id: rce_graph
    min_graph_schema_version: "3"
    evaluator_params:
      require_primary_sources: true
      emit_one_per_sink: true
  - id: RULE-UPLOAD-001
    description: "Graph flow to file upload sink"
    severity_band: HIGH
    python_evaluator_id: upload_graph
    min_graph_schema_version: "3"
    evaluator_params:
      require_non_static_sink: true
      emit_one_per_sink: true
  - id: RULE-SSRF-001
    description: "Graph flow to HTTP client sink"
    severity_band: LOW
    python_evaluator_id: ssrf_graph
    min_graph_schema_version: "3"
    evaluator_params:
      emit_one_per_sink: true
  - id: RULE-CSV-001
    description: "Graph flow to CSV output sink"
    severity_band: LOW
    python_evaluator_id: csv_graph
    min_graph_schema_version: "3"
    evaluator_params:
      emit_one_per_sink: true
  - id: RULE-WP-NONCE-001
    description: "Nonce verification gated only on GET"
    severity_band: MEDIUM
    python_evaluator_id: wp_nonce_get_only
    min_graph_schema_version: "3"
  - id: RULE-WP-AJAX-001
    description: "nopriv AJAX without capability check"
    severity_band: HIGH
    python_evaluator_id: ajax_nopriv_no_cap
    min_graph_schema_version: "3"
  - id: RULE-WP-REST-001
    description: "REST route with weak or missing permission callback"
    severity_band: HIGH
    python_evaluator_id: wp_rest_weak
    min_graph_schema_version: "3"
  - id: RULE-WP-IDOR-001
    description: "Heuristic IDOR: user input to sensitive sink without file-level cap check"
    severity_band: MEDIUM
    python_evaluator_id: wp_idor_graph
    min_graph_schema_version: "3"
    enabled: true
    evaluator_params:
      allowed_sink_kinds: ["SQL", "HTML", "OBJECT_INJECTION"]
      emit_one_per_sink: true
  - id: RULE-OBJINJ-001
    description: "Object injection entrypoint signal"
    severity_band: MEDIUM
    python_evaluator_id: object_injection_signal
    min_graph_schema_version: "3"
